<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>

    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="../assets/favicon/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="../assets/favicon/android-chrome-512x512.png"
    />
    <link rel="apple-touch-icon" size="180x180" href="../assets/favicon/apple-touch-icon.png" />
    <link
      rel="shortcut icon"
      sizes="any"
      href="../assets/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />

    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/issue_collector/welcome.css" />

    <link rel="stylesheet" href="./styles/login.css" />

    <script src="./scripts/login.js" defer></script>
    <script src="./scripts/auth/auth.js" defer></script>
    <script src="./scripts/config.js" defer></script>
    <script src="./scripts/services.js" defer></script>
    <script src="./scripts/utils/helpers.js"></script>
  </head>

  <body class="has-splash central-body" onload="startSplash()">
    <div class="splash" id="splash" aria-hidden="true">
      <img class="splash-logo" src="../assets/imgs/join-logo.svg" alt="Join logo" />
    </div>

    <div class="top-bar">
      <span>Not a Join user? </span>
      <a href="./pages/signup.html" class="primary-btn">Sign up</a>
    </div>

    <div class="welcome-card">
      <div class="welcome-message">
        <div class="welcome-text">
          <p>Welcome</p>
          <div class="welcome-underline"></div>
        </div>
        <p class="subtext">
          Pick the option that suits your role: create a request as a stakeholder or log in if
          you're part of the team.
        </p>
      </div>

      <div class="welcome-button-group">
        <div class="button-group-item">
          <label class="subtext" for="login-button">Are you a stakeholder?</label>
          <button type="submit" class="primary-btn" id="login-button">Create a request</button>
        </div>
        <div class="button-group-item">
          <label class="subtext" for="login-guest-button">Are you a team member?</label>
          <button type="button" class="secondary-btn" id="login-guest-button">Member Log in</button>
        </div>
      </div>

      <div class="footer-links">
        <a href="./pages/privacy-policy.html">Privacy Policy</a>
        <a href="./pages/legal-notice.html">Legal notice</a>
      </div>
    </div>
  </body>
</html>
